plugins {
    id 'com.android.application'
}

def repoRoot = file('../../..')

android {
    namespace 'io.github.skibidiboiler.louieattack'
    compileSdk 36
    ndkVersion '30.0.16248370'

    defaultConfig {
        applicationId 'io.github.skibidiboiler.louieattack'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path new File(repoRoot, 'CMakeLists.txt')
            version '3.30.4'
        }
    }

    sourceSets {
        main {
            // SDLActivity and friends come straight from the SDL submodule.
            java.srcDirs += new File(repoRoot, 'external/SDL/android-project/app/src/main/java')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
